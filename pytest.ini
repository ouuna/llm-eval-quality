[pytest]
# ============================================================
# pytest 配置
#
# marker 分区的意义
# --------------
# 本项目的测试按「运行代价」分四类：
#
#   offline   纯离线，毫秒级，不需要任何依赖
#   api       启动本地 HTTP 服务，不调用 LLM
#   live      真实调用 LLM，需要 API Key，秒级到十秒级
#   perf      性能/并发测试，耗时最长
#
# 分区的实际用途：
#   提交前只跑 offline + api（几秒，给即时反馈）
#   CI 每次提交跑 offline + api
#   CI 定时或发版前跑全部（含 live 与 perf）
#
# 没有分区的话，开发者每次改一行代码都要等 LLM 跑完几十条用例，
# 最后的结果就是大家都不跑测试。
# ============================================================

testpaths = tests

# 默认只跑离线部分。
# `pytest` 不带参数时应该在 10 秒内结束——
# 达不到的话，开发者就不会在本地跑它。
addopts =
    -m "not live and not perf"
    --strict-markers
    -ra

markers =
    offline: 纯离线测试，不需要 API Key 与网络（默认）
    api: 需要启动本地 HTTP 服务，但不调用 LLM
    live: 需要真实调用 LLM，需配置 API Key
    perf: 性能与并发测试，耗时较长

# 报告格式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# marker 由 tests/conftest.py 的 pytest_collection_modifyitems 自动打，
# 依据是文件所在目录与是否声明了 live。
# 这样做的好处：不必给 500+ 个测试逐个加装饰器，
# 也不会因为漏标某个测试导致它跑到错误的阶段。
filterwarnings =
    ignore::DeprecationWarning
