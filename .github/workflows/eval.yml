name: LLM Quality Gate

# ============================================================
# 触发策略（需求第二十条）
#
#   PR    → smoke evaluation（快速反馈）
#   main  → smoke + full（合并后全面回归）
#   定时  → 每日回归，检测环境或依赖变化
#   手动  → 可选数据集 + 可选启用 Judge/Semantic
# ============================================================

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

  push:
    branches: [ main ]

  schedule:
    # 每日 02:00 UTC 定时回归
    - cron: '0 2 * * *'

  workflow_dispatch:
    inputs:
      dataset:
        description: 要运行的数据集
        required: false
        default: 'full'
        type: choice
        options: [ smoke, full, smoke+full ]
      enable_judge:
        description: 是否启用 LLM Judge（成本较高）
        required: false
        default: false
        type: boolean
      enable_semantic:
        description: 是否启用 Embedding 语义评测
        required: false
        default: false
        type: boolean

# 新提交取消旧的未完成运行
concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # Job 0: workflow 自身语法检查
  #
  # 为什么放在最前面：workflow 语法错误会让整个文件作废，
  # 表现为 CI 1 秒内直接Failure，连哪个 job 挂了都看不出来。
  # Phase 13 的 job 级 if 误用了表达式包裹（secrets 前带美元双括号），
  # 就是这样连续让 3 次 push 秒挂。
  # 这个 job 失败说明「配置文件本身有问题」，后面的 job 根本不会跑，
  # 所以它必须最先跑，且不依赖其他 job。
  # ==========================================================
  workflow-lint:
    name: Workflow 语法检查
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 检查 workflow 配置
        run: python -m tests.check_workflow

  # ==========================================================
  # Job 1: 离线单元测试（无需任何密钥，秒级完成）
  # ==========================================================
  unit-tests:
    name: 单元测试（离线）
    runs-on: ubuntu-latest
    needs: workflow-lint

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install pytest

      - name: 运行离线测试
        # Mock Provider 使这些测试无需 API 即可运行
        run: |
          python -m pytest tests/ \
            --ignore=tests/evaluators/test_semantic.py \
            --ignore=tests/evaluators/test_judge.py \
            --ignore=tests/test_quality_gate.py \
            -v --tb=short

  # ==========================================================
  # Job 2: 离线评测链路（Mock 模式，无需密钥）
  # ==========================================================
  offline-eval:
    name: 评测链路（Mock）
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install pytest

      - name: 验证数据集合法性
        run: python -m eval validate --dataset full

      - name: Mock 模式跑完整链路
        # Mock Provider 故意注入故障（幻觉、实体调换、拒答错误等），
        # 因此质量门禁**理应失败**，退出码为 1。
        # 这个 job 验证的是「评测链路能否跑通并正确识别缺陷」，
        # 不是「门禁能否通过」——把两者混为一谈会导致 CI 误报。
        #
        # 正确做法：把「链路是否正常」与「门禁判定」分开断言。
        #   · 退出码 ∈ {0, 1}  → 链路正常完成（0=通过，1=门禁拦下）
        #   · 退出码 ∈ {2, 3, 4} → 配置/数据/运行错误，链路异常
        run: |
          set +e
          python -m eval run --dataset smoke --mock
          code=$?
          set -e
          echo "mock 评测退出码：$code"
          case "$code" in
            0|1)
              echo "::notice::评测链路正常完成。门禁结果符合预期："
              echo "::notice::Mock Provider 注入的缺陷被门禁识别，这是正确行为。"
              ;;
            2)
              echo "::error::配置错误 —— 链路未能启动"
              exit 1
              ;;
            3)
              echo "::error::数据错误 —— 数据集不合法"
              exit 1
              ;;
            4)
              echo "::error::运行错误 —— 评测过程崩溃"
              exit 1
              ;;
            *)
              echo "::error::非预期退出码：$code"
              exit 1
              ;;
          esac

      - name: 上传离线报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-eval-reports
          path: reports/
          retention-days: 14

  # ==========================================================
  # Job 3: 评测器自检
  # ==========================================================
  evaluator-validation:
    name: 评测器可靠性验证
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 评测器验证报告
        run: python -m eval.evaluators.validation

      - name: 回归集统计
        run: python -m eval.datasets.regression

  # ==========================================================
  # Job 4: 真实 API 评测（需要密钥）
  # ==========================================================
  evaluation:
    name: 质量评测
    runs-on: ubuntu-latest
    needs: [ unit-tests, offline-eval ]
    # 注意：这里不能用 job 级 if 判断密钥。
    #
    # GitHub 在解析 workflow 文件时就求值 job 级 if，
    # 那时 secrets 尚未注入，因此 job 级 if 里 secrets 完全不可用——
    # 无论写成裸表达式还是表达式包裹形态，都会报
    # Unrecognized named-value: 'secrets'，且整个 workflow 文件作废。
    #
    # 所以「无密钥则跳过」的逻辑放在 step 级（见下方密钥检查 step），
    # 那时 secrets 已经可用。

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install pytest

      - name: 决定数据集
        id: ds
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=smoke" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "value=smoke+full" >> $GITHUB_OUTPUT
          else
            echo "value=${{ inputs.dataset || 'full' }}" >> $GITHUB_OUTPUT
          fi

      - name: 密钥检查
        id: keycheck
        # CI 里继续使用 OPENAI_* 变量名（secrets 已按此配置，无需改动）。
        # 这同时验证了向后兼容路径：本地推荐用 EVAL_* 隔离环境变量，
        # 但程序读 OPENAI_* 依然有效。
        #
        # 密钥判断必须放在 step 级：job 级 if 在解析文件时就求值，
        # 那时 secrets 尚未注入。step 级则已可用。
        #
        # 语义是「明确跳过」而非「假装成功」：无密钥时输出 warning
        # 并让后续评测步骤跳过，而不是让 job 变绿假装跑过。
        env:
          KEY: ${{ secrets.OPENAI_API_KEY }}
          URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL: ${{ secrets.OPENAI_MODEL_NAME }}
        run: |
          if [ -z "$KEY" ] || [ -z "$URL" ] || [ -z "$MODEL" ]; then
            echo "::warning::未配置完整的 API secrets，跳过真实 API 评测"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "模型：$MODEL"
          echo "接口：$URL"
          echo "数据集：${{ steps.ds.outputs.value }}"
          echo "---"
          python -m eval config
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: 执行质量评测
        if: steps.keycheck.outputs.skip == 'false'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL_NAME: ${{ secrets.OPENAI_MODEL_NAME }}
        run: |
          EXTRA=""
          if [ "${{ inputs.enable_judge }}" = "true" ]; then EXTRA="$EXTRA --judge"; fi
          if [ "${{ inputs.enable_semantic }}" = "true" ]; then EXTRA="$EXTRA --semantic"; fi
          python -m eval run --dataset "${{ steps.ds.outputs.value }}" $EXTRA

      - name: 基线对比
        if: steps.keycheck.outputs.skip == 'false'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL_NAME: ${{ secrets.OPENAI_MODEL_NAME }}
        run: |
          if [ -f reports/baseline.json ]; then
            python -m eval run --dataset "${{ steps.ds.outputs.value }}" \
              --compare-baseline || true
          else
            python -m eval run --dataset "${{ steps.ds.outputs.value }}" \
              --save-baseline
          fi

      - name: 上传报告制品
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30

      - name: 写入步骤摘要
        if: always()
        run: |
          {
            echo "### 评测报告"
            echo ""
            echo "- 制品：\`eval-reports-${{ github.run_number }}\`（保留 30 天）"
            echo "- 下载：Actions 页面 → Artifacts"
          } >> $GITHUB_STEP_SUMMARY
