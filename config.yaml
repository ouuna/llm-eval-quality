# ============================================================
# LLM 质量评测系统 · 运行配置
# 换业务场景只需修改本文件 + knowledge/ + cases.csv，无需改动代码
# ============================================================

# ---------------- 被测系统 ----------------
system:
  # 知识库文件（支持 txt / md，可配置多个）
  knowledge_files:
    - knowledge/test_basics.txt
  # 文档分隔符：空行分隔为多条文档
  doc_separator: "\n\n"
  # 检索返回的片段数
  top_k: 3

# ---------------- 模型配置 ----------------
model:
  # 留空则读取环境变量 OPENAI_API_KEY
  api_key: ""
  base_url: ""       # 留空则读取 OPENAI_BASE_URL
  name: ""           # 留空则读取 OPENAI_MODEL_NAME
  temperature: 0.3   # 降低随机性，提升输出稳定性
  max_retry: 3
  timeout: 60
  # 调用间隔（秒），用于避免 API 限流
  call_interval: 0.5

# ---------------- Prompt 配置 ----------------
prompt:
  # 防幻觉约束：不加这句，域外拒答率会从 100% 掉到 0%
  enable_hallucination_guard: true
  template: |
    你是软件测试领域的助手。请严格仅根据以下参考资料回答问题。
    如果参考资料中没有相关信息，请明确回答"参考资料中未提及"，不要编造或推测。

    参考资料：
    {context}

    问题：{question}

    请用中文简洁回答：

# ---------------- 评测配置 ----------------
evaluation:
  # 幻觉检测：实词覆盖率阈值，低于此值判定为幻觉
  hallucination_threshold: 0.6
  # 完整性检测：关键要点覆盖率阈值
  completeness_threshold: 0.7
  # 稳定性测试：同一问题重复次数
  stability_repeat: 3
  # 稳定性相似度算法：jaccard（字符集合）/ overlap（最长公共子序列）
  stability_metric: jaccard
  # 每条用例之间的调用间隔
  between_cases_delay: 0.5

# ---------------- 质量门禁 ------------------
# 不达标即测试失败，可用于 CI 阻断
gate:
  min_overall_pass_rate: 0.95
  min_accuracy_in_domain: 1.0
  min_refusal_rate: 1.0      # 核心防幻觉指标，必须 100%
  min_hallucination_free: 0.95
  min_retrieval_hit_rate: 0.60
  min_avg_relevance: 0.40
  min_avg_stability: 0.85

# ---------------- 报告输出 ----------------
report:
  output_dir: reports
  formats: [json, html, csv]
